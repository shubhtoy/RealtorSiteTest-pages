name: Bug report
description: Something on the site isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. For security issues, do NOT file here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click the aerial view in the gallery, nothing opens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /gallery
        2. Click the aerial view tile
        3. See that the lightbox does not open
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://babaflats.com/gallery
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home
        - Gallery
        - Contact form
        - Studio (content editor)
        - Deployment / infra
        - Other
  - type: input
    id: environment
    attributes:
      label: Device / browser
      placeholder: iPhone 15, Safari 17
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
