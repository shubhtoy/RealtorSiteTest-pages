name: Feature request
description: Suggest a new capability or improvement
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or the gap, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Add 1BR / 2BR / 3BR unit tour videos to the gallery.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home
        - Gallery
        - Contact form
        - Studio (content editor)
        - SEO / content
        - Deployment / infra
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
